{% extends "base.html" %}

{% block titulo %}Cadastro | Ponto & Vírgula{% endblock %}

{% block conteudo %}
<section class="caixa">
    <h1>Criar conta</h1>
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
</section>
{% endblock %}
