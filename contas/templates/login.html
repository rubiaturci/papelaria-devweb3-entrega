{% extends "base.html" %}

{% block titulo %}Entrar | Ponto & Vírgula{% endblock %}

{% block conteudo %}
<section class="caixa">
    <h1>Entrar</h1>
    <p class="subtitulo">Use o nome de usuário escolhido no cadastro, não o e-mail.</p>
    <form class="formulario" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Entrar</button>
    </form>
    <p><a href="{% url 'password_reset' %}">Esqueci minha senha</a></p>
    <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</section>
{% endblock %}
