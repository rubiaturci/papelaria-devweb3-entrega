{% extends "base.html" %}

{% block titulo %}Recuperar senha | Ponto & Vírgula{% endblock %}

{% block conteudo %}
<section class="caixa">
    <h1>Recuperar senha</h1>
    <p>Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Enviar link</button>
        <a href="{% url 'login' %}">Voltar</a>
    </form>
</section>
{% endblock %}
