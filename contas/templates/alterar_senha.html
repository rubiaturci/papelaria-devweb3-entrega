{% extends "base.html" %}

{% block titulo %}Alterar senha | Ponto & Vírgula{% endblock %}

{% block conteudo %}
<section class="caixa">
    <h1>Alterar senha</h1>
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Salvar</button>
        <a href="{% url 'minha_conta' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
