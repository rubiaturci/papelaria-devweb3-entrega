{% extends "base.html" %}

{% block titulo %}Minha conta | Ponto & Vírgula{% endblock %}

{% block conteudo %}
<section class="caixa">
    <h1>Olá, {{ user.username }}!</h1>
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Salvar</button>
    </form>
    <p><a href="{% url 'alterar_senha' %}">Alterar senha</a></p>
</section>
{% endblock %}
