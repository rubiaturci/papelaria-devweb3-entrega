{% extends "base.html" %}

{% block titulo %}{{ titulo }} | Ponto & Vírgula{% endblock %}

{% block conteudo %}
<section class="caixa">
    <h1>{{ titulo }}</h1>
    <p class="subtitulo">Informe os dados do integrante. A foto é o endereço (URL) de uma imagem pública.</p>
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">{% if titulo == "Editar integrante" %}Salvar alterações{% else %}Cadastrar integrante{% endif %}</button>
        <a href="{% url 'gerenciar_equipe' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
