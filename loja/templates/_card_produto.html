<article class="card card-produto">
    <a href="{% url 'produto_detalhe' produto.id %}">
        {% if produto.imagem %}
            <img src="{{ produto.imagem.url }}" alt="{{ produto.nome }}">
        {% else %}
            <div class="sem-foto">Sem foto</div>
        {% endif %}
        <div class="card-texto">
            <small>{{ produto.categoria }}</small>
            <h3>{{ produto.nome }}</h3>
            {% if produto.descricao %}<p>{{ produto.descricao|truncatechars:70 }}</p>{% endif %}
            <strong>R$ {{ produto.preco }}</strong>
        </div>
    </a>
    <div class="card-compra">
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'comprar' produto.id %}">
                {% csrf_token %}
                <button class="botao" type="submit">Comprar</button>
            </form>
        {% else %}
            <a class="botao" href="{% url 'login' %}?next={{ request.path|urlencode }}">Comprar</a>
        {% endif %}
    </div>
</article>
