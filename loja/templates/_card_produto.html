<article class="card">
    <a href="{% url 'produto_detalhe' produto.id %}">
        {% if produto.imagem %}
            <img src="{{ produto.imagem.url }}" alt="{{ produto.nome }}">
        {% else %}
            <div class="sem-foto">Sem foto</div>
        {% endif %}
        <div class="card-texto">
            <small>{{ produto.categoria }}</small>
            <h3>{{ produto.nome }}</h3>
            <strong>R$ {{ produto.preco }}</strong>
        </div>
    </a>
</article>
